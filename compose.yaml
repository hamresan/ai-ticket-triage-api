services:
  api:
    build:
      context: .
    image: ai-ticket-triage:local
    ports:
      - "8000:8000"
    environment:
      APP_NAME: "AI Support Ticket Triage API"
      APP_ENV: local
      DATABASE_URL: sqlite+aiosqlite:////data/ai_ticket_triage.db
      TRIAGE_PROVIDER: fake
      PROVIDER_MODEL: ""
      PROVIDER_BASE_URL: ""
      PROVIDER_TIMEOUT_SECONDS: "10"
      PROVIDER_API_KEY: ""
    volumes:
      - ticket_data:/data
    command:
      - sh
      - -c
      - alembic upgrade head && exec uvicorn ai_ticket_triage.presentation.app:create_app --factory --host 0.0.0.0 --port 8000
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  ticket_data:
