[project]
name = "ai-ticket-triage"
version = "0.1.0"
description = "Production-quality FastAPI support-ticket triage service"
readme = "README.md"
keywords = ["fastapi", "ai", "support", "triage", "clean-architecture"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "aiosqlite>=0.21,<1.0",
    "alembic>=1.16,<2.0",
    "fastapi>=0.116,<1.0",
    "httpx>=0.28,<1.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy>=2.0.43,<3.0",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.urls]
Repository = "https://github.com/hamresan/ai-ticket-triage-api"
Issues = "https://github.com/hamresan/ai-ticket-triage-api/issues"

[dependency-groups]
dev = [
    "pyright>=1.1.405,<2.0",
    "pytest>=8.4,<9.0",
    "pytest-cov>=6.2,<7.0",
    "ruff>=0.12,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_ticket_triage"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["ai_ticket_triage"]

[tool.coverage.report]
fail_under = 85
show_missing = true
